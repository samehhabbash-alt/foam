<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6E6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>سجل الفوم — مشتريات ومبيعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#1E2B2F; --muted:#66767C; --line:#E4DFD4; --soft:#EFEBE2;
  --pri:#0E6E6E; --pri2:#0A5656; --priBg:#DDF0EE; --onpri:#fff;
  --pur:#B94B31; --purBg:#FBE9E3; --sal:#27774A; --salBg:#E1F3E8;
  --warn:#A9690B; --warnBg:#FDF0D5; --bad:#B8322A; --badBg:#FBE3E0; --ok:#27774A;
  --shadow:0 1px 2px rgba(30,43,47,.06),0 4px 14px rgba(30,43,47,.07);
  --r:16px; --fs:17px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#101719; --card:#182326; --ink:#E7EEEF; --muted:#93A5AB; --line:#2A3A3E; --soft:#1F2D31;
    --pri:#3FB6AB; --pri2:#2E9A90; --priBg:#17393A; --onpri:#06201f; --pur:#F08A6E; --purBg:#3A2119; --sal:#5CC688; --salBg:#17321F;
    --warn:#E8B04E; --warnBg:#3A2D12; --bad:#F08178; --badBg:#3B1B18; --ok:#5CC688; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-weight:500;line-height:1.55;direction:rtl;text-align:right;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:800}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)} .b{font-weight:800} .sb{font-weight:700} .c{text-align:center} .sm{font-size:.82rem} .xs{font-size:.74rem}
.hide{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--pri);color:var(--onpri);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:1.2rem;flex:1}
header.top .sync{font-size:.74rem;font-weight:700;opacity:.92;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#9be7a8;display:inline-block}
.dot.off{background:#ffb4a8}.dot.wait{background:#ffe08a}.dot.loc{background:#d6d6d6}
.iconbtn{background:rgba(255,255,255,.16);border:0;color:inherit;border-radius:12px;width:42px;height:42px;font-size:1.2rem;cursor:pointer}
main{padding:14px 14px 20px;max-width:760px;margin:0 auto}
.page-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.page-title h2{font-size:1.25rem}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card>h3{font-size:1.02rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border-radius:14px;padding:12px;background:var(--soft);min-height:84px}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:700}
.kpi .v{font-size:1.28rem;font-weight:800;line-height:1.25;margin-top:2px;word-break:break-word}
.kpi .s{font-size:.76rem;color:var(--muted);margin-top:2px}
.kpi.pur{background:var(--purBg)}.kpi.pur .v{color:var(--pur)}
.kpi.sal{background:var(--salBg)}.kpi.sal .v{color:var(--sal)}
.kpi.pri{background:var(--priBg)}.kpi.pri .v{color:var(--pri)}
.kpi.warn{background:var(--warnBg)}.kpi.warn .v{color:var(--warn)}
.kpi.bad{background:var(--badBg)}.kpi.bad .v{color:var(--bad)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);font-weight:600}
.kv.tot{font-weight:800;border-top:2px solid var(--line);border-bottom:0;margin-top:4px;padding-top:10px}
.kv.sub .k{padding-inline-start:12px;font-size:.92rem}

/* buttons / chips */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--pri);color:var(--onpri);min-height:48px}
.btn.pur{background:var(--pur);color:#fff}.btn.sal{background:var(--sal);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)} .btn.line{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--badBg);color:var(--bad)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:.88rem;border-radius:11px}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.row>.grow{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.92rem;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.chip.pur.on{background:var(--pur);border-color:var(--pur);color:#fff}.chip.sal.on{background:var(--sal);border-color:var(--sal);color:#fff}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 6px;font-weight:800;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg.pur button.on{background:var(--pur);color:#fff}.seg.sal button.on{background:var(--sal);color:#fff}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.76rem;font-weight:800}
.b-paid{background:var(--salBg);color:var(--ok)}.b-open{background:var(--soft);color:var(--muted)}.b-partial{background:var(--warnBg);color:var(--warn)}.b-overdue{background:var(--badBg);color:var(--bad)}.b-void{background:var(--soft);color:var(--muted);text-decoration:line-through}.b-over{background:var(--warnBg);color:var(--warn)}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:.74rem;font-weight:800}
.tag.P{background:var(--purBg);color:var(--pur)}.tag.S{background:var(--salBg);color:var(--sal)}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-inline-end:5px}

/* list items */
.item{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow)}
.item .t1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800}
.item .t2{color:var(--muted);font-size:.86rem;margin-top:2px}
.item .t3{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.item.void{opacity:.55}
.dayhdr{font-weight:800;color:var(--muted);font-size:.85rem;margin:14px 4px 6px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty .big{font-size:2.2rem}

/* inputs */
.fld{margin-bottom:12px}
.fld>label,.lbl{display:block;font-weight:700;font-size:.88rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=search],input[type=tel],input[type=date],input[type=password],input[type=url],select,textarea,input[inputmode=decimal]{width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 12px;min-height:50px;font-weight:600;font-size:1rem;appearance:none;-webkit-appearance:none}
input[type=date]{text-align:right}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' fill='none' stroke='%2366767C' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:left 12px center;padding-inline-end:12px;padding-inline-start:34px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
input.num-in{direction:ltr;text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.col{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 10px;font-weight:700;cursor:pointer;font-size:.9rem}
.col i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.28);display:inline-block}
.col.on{border-color:var(--pri);background:var(--priBg)}
.calc{background:var(--priBg);border-radius:14px;padding:10px 14px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.calc .v{font-weight:800;font-size:1.08rem;color:var(--pri)}
.totalbox{background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
.totalbox .v{font-size:1.5rem;font-weight:800}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.hint button{border:0;background:none;color:var(--pri);font-weight:800;padding:0;cursor:pointer;text-decoration:underline}
.sect{font-weight:800;color:var(--pri);margin:18px 2px 8px;font-size:.95rem;border-bottom:2px solid var(--priBg);padding-bottom:4px}

/* bottom nav */
nav.bar{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
nav.bar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:.72rem;color:var(--muted);padding:4px 0;cursor:pointer;position:relative}
nav.bar button .ic{font-size:1.35rem;line-height:1.2}
nav.bar button.on{color:var(--pri)}
nav.bar button.on::before{content:'';position:absolute;top:-7px;width:34px;height:4px;border-radius:0 0 4px 4px;background:var(--pri)}
nav.bar .fab{transform:translateY(-16px)}
nav.bar .fab span.circ{width:56px;height:56px;border-radius:50%;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 6px 16px rgba(14,110,110,.4);margin-bottom:-14px}
.pill{position:absolute;top:0;inset-inline-end:22%;background:var(--bad);color:#fff;border-radius:999px;font-size:.66rem;padding:0 6px;min-width:18px;line-height:18px;font-weight:800}

/* sheet modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;max-height:94dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h2{flex:1;font-size:1.1rem}
.sheet .body{overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.sheet footer{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--bg)}
.sheet footer .btn{flex:1}
.x{background:var(--soft);border:0;border-radius:50%;width:38px;height:38px;font-size:1.1rem;cursor:pointer}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));inset-inline:16px;margin:auto;max-width:520px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:90;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center}
.toast.err{background:var(--bad);color:#fff}

/* charts, bars */
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px}
.bars .col2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .pair{display:flex;align-items:flex-end;gap:1px;height:calc(100% - 20px);width:100%;justify-content:center}
.bars .bar{flex:1;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.bars .bar.p{background:var(--pur)}.bars .bar.s{background:var(--sal)}
.bars .lab{font-size:.62rem;color:var(--muted);height:20px;line-height:20px;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:.8rem;margin-top:6px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.aging{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--soft);margin:8px 0}
.aging span{display:block;height:100%}
.ag0{background:#6BB88D}.ag1{background:#E8C45A}.ag2{background:#E39A4B}.ag3{background:#D9694F}.ag4{background:#A92E2E}
.agleg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-size:.68rem;color:var(--muted);font-weight:700}
.agleg b{display:block;color:var(--ink);font-size:.78rem}
.period{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.period .lab{flex:1;text-align:center;font-weight:800;font-size:.98rem;line-height:1.3}
.period button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:1.2rem;cursor:pointer;font-weight:800}
details.party{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;box-shadow:var(--shadow)}
details.party>summary{list-style:none;padding:12px;cursor:pointer;display:block}
details.party>summary::-webkit-details-marker{display:none}
details.party .inner{padding:0 12px 12px}
.inv{border-top:1px dashed var(--line);padding:9px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.warnbox{background:var(--warnBg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.88rem;margin-bottom:10px}
.stmt-row{display:grid;grid-template-columns:62px 1fr auto auto;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.86rem;align-items:center}
.print-only{display:none}
@media print{
  header.top,nav.bar,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000;padding:0}.card{box-shadow:none;break-inside:avoid}.print-only{display:block}
}

</style>
</head>
<body><div style="padding:40px;text-align:center">جارٍ التحميل…</div>
<script>
/* ===== CORE: pure business logic (no DOM) ===== */
(function (root) {
'use strict';

const CURRENCY = 'ج.م';
const ITEMS = [
  { name: 'فوم بولي إيثيلين - ألواح', grp: 'sheet' },
  { name: 'فوم بولي إيثيلين - رولات', grp: 'roll' },
  { name: 'مواسير فوم بولي إيثيلين - مفرغة', grp: 'pipeH' },
  { name: 'مواسير فوم بولي إيثيلين - مصمتة', grp: 'pipeS' },
  { name: 'زوايا فوم بولي إيثيلين', grp: 'corner' },
  { name: 'ألواح الفوم الأبيض', grp: 'sheet' },
  { name: 'ألواح الفوم الأزرق الصلب', grp: 'sheet' },
  { name: 'ألواح فوم إيفا (EVA)', grp: 'eva' },
];
const GROUPS = {
  sheet:  { label: 'ألواح',        fields: ['thick', 'width', 'length', 'count', 'tot'], units: ['m3', 'm2', 'pc'], def: 'm3' },
  roll:   { label: 'رولات',        fields: ['thick', 'width', 'length', 'count'],        units: ['roll', 'm2', 'lm'], def: 'roll' },
  pipeH:  { label: 'ماسورة مفرغة', fields: ['dIn', 'dOut', 'length', 'count', 'tot'],    units: ['lm', 'pc'], def: 'lm' },
  pipeS:  { label: 'ماسورة مصمتة', fields: ['dOut', 'length', 'count', 'tot'],           units: ['lm', 'pc'], def: 'lm' },
  corner: { label: 'زوايا',        fields: ['arm1', 'arm2', 'length', 'count', 'tot'],   units: ['lm', 'pc'], def: 'lm' },
  eva:    { label: 'إيفا',         fields: ['thick', 'width', 'length', 'count', 'tot', 'face'], units: ['m2', 'pc'], def: 'm2' },
};
const UNITS = {
  m3:   { label: 'متر مكعب',   short: 'م³' },
  m2:   { label: 'متر مربع',   short: 'م²' },
  lm:   { label: 'متر طولي',   short: 'م.ط' },
  roll: { label: 'رول',        short: 'رول' },
  pc:   { label: 'عود / قطعة', short: 'قطعة' },
};
const FIELD_LABELS = {
  thick: 'السمك (مم)', width: 'العرض (م)', length: 'الطول (م)', count: 'العدد',
  tot: 'إجمالي الأمتار (اختياري)', dIn: 'القطر الداخلي (مم)', dOut: 'القطر الخارجي (مم)',
  arm1: 'الذراع الأول (سم)', arm2: 'الذراع الثاني (سم)', face: 'الوجه',
};
const COUNT_LABEL = { sheet: 'عدد الأفرخ', roll: 'عدد الرولات', pipeH: 'عدد العيدان', pipeS: 'عدد العيدان', corner: 'عدد القطع', eva: 'عدد الأفرخ' };
const FACES = ['وجه ناعم + وجه خشن', 'وجهان ناعمان', 'وجهان خشنان'];
const COLORS = [
  ['أبيض', '#F4F4F0'], ['أسود', '#222222'], ['رمادي', '#8A8F94'], ['أخضر', '#3E9B5F'],
  ['فوشيا', '#D1197A'], ['بنفسجي', '#7A4FB5'], ['بينك', '#F29BBB'], ['أحمر', '#D2392F'],
  ['برتقالي', '#EE8A2B'], ['أزرق', '#2F73C9'], ['أصفر', '#EBC62F'], ['بيج', '#D9C3A0'],
];
const METHODS = ['كاش', 'محفظة إلكترونية', 'إنستا باي', 'تحويل بنكي', 'شيك'];
const TERMS = [0, 7, 15, 30, 45, 60, 90];
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

/* ---------- numbers & text ---------- */
function parseNum(v) {
  if (v === null || v === undefined || v === '') return NaN;
  if (typeof v === 'number') return v;
  let s = String(v).trim();
  s = s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
       .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
       .replace(/[٫,]/g, '.').replace(/٬/g, '').replace(/\s+/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
const num = v => { const n = parseNum(v); return isNaN(n) ? 0 : n; };
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const r4 = x => Math.round((x + Number.EPSILON) * 10000) / 10000;
function fmt(n, d) {
  n = +n || 0;
  const dec = d === undefined ? (Math.abs(n - Math.round(n)) < 0.005 ? 0 : 2) : d;
  return n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
const fmtQty = n => fmt(r4(n), Math.abs(n - Math.round(n)) < 0.00005 ? 0 : (Math.abs(n * 10 - Math.round(n * 10)) < 0.0005 ? 1 : 2));
const money = n => fmt(n) + ' ' + CURRENCY;
const normName = s => String(s || '').replace(/\s+/g, ' ').trim();
const nameKey = s => normName(s).replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase();

/* ---------- dates (ISO strings, UTC arithmetic: no timezone surprises) ---------- */
const p2 = n => (n < 10 ? '0' : '') + n;
const parseD = s => { const a = String(s).slice(0, 10).split('-').map(Number); return Date.UTC(a[0], a[1] - 1, a[2]); };
const fmtD = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); };
const addDays = (s, n) => fmtD(parseD(s) + n * 864e5);
const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 864e5);

/* ---------- accounting model ----------

/* moving-average inventory + cost of goods sold per sale */

    upsert(db.pays, Object.assign({}, op.pay, { status: 'active', by: S.set.user || '', at: new Date().toISOString().slice(0, 19) }));
  } else if (op.op === 'voidTx') { const t = db.txns.find(x => x.id === op.id); if (t) t.status = 'void'; }
  else if (op.op === 'voidPay') { const p = db.pays.find(x => x.id === op.id); if (p) p.status = 'void'; }
}
function commit(ops) {
  ops.forEach(applyLocal);
  if (remote()) S.out.push(...ops);
  persist();
  render();
  if (remote()) flush();
}

/* ---------- backend ---------- */
async function api(action, extra) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(S.set.url, { method: 'POST', body: JSON.stringify(Object.assign({ pin: S.set.pin, action }, extra || {})), redirect: 'follow', signal: ctl.signal });
    const j = await r.json();
    return j;
  } finally { clearTimeout(to); }
}
const AUTH_ERR = /الرقم السري|محاولات|غيّر الرقم/;
function setStatus(s) { S.status = s; const el = $('#sync'); if (el) el.innerHTML = syncHtml(); }
function syncHtml() {
  if (!remote()) return '<span class="dot loc"></span>محلي';
  const vw = (S.set.viewAs && S.set.role === 'admin') ? ' · عرض: ' + esc(S.set.viewAs) : '';
  const n = S.out.length;
  if (S.status === 'wait') return '<span class="dot wait"></span>مزامنة…' + vw;
  if (S.status === 'off') return '<span class="dot off"></span>غير متصل' + (n ? ' (' + n + ' معلّق)' : '') + vw;
  return '<span class="dot"></span>' + (n ? n + ' معلّق' : 'متزامن') + vw;
}
async function flush() {
  if (!remote() || S.busy) return;
  S.busy = true; setStatus('wait');
  try {
    while (S.out.length) {
      const batch = S.out.slice(0, 15);
      const r = await api('batch', { ops: batch });
      if (!r.ok) {
        if (AUTH_ERR.test(r.error || '')) { toast(r.error, true); S.out.length = 0; persist(); openSettings(); break; }
        throw new Error(r.error || 'خطأ');
      }
      const bad = (r.results || []).map((x, i) => ({ x, op: batch[i] })).filter(o => !o.x.ok);
      S.out.splice(0, batch.length);
      if (bad.length) toast('تعذر حفظ ' + bad.length + ' عملية: ' + bad[0].x.error, true);
      S.rev = r.rev; persist();
    }
    await refresh(true);
    setStatus('ok');
  } catch (e) { S.lastErr = String(e.message || e); setStatus('off'); }
  finally { S.busy = false; setStatus(S.status === 'off' ? 'off' : 'ok'); }
}
async function refresh(quiet) {
  if (!remote()) return;
  try {
    if (S.out.length) return;
    const r = await api('list');
    if (!r.ok) { if (AUTH_ERR.test(r.error || '')) { toast(r.error, true); openSettings(); } else throw new Error(r.error); return; }
    S.db = { txns: r.txns, pays: r.pays }; S.rev = r.rev; S.set.user = r.user; S.set.role = r.role; persist(); setStatus('ok'); render();
  } catch (e) { S.lastErr = String(e.message || e); setStatus('off'); if (!quiet) toast('تعذر الاتصال بالخادم', true); }
}
async function poll() {
  if (!remote() || document.hidden || S.busy) return;
  if (S.out.length) return flush();
  try { const r = await api('rev'); if (r.ok && r.rev !== S.rev) await refresh(true); else if (r.ok) setStatus('ok'); } catch (e) { setStatus('off'); }
}

async function connect() {
  const url = $('#setUrl').value.trim(), pin = $('#setPin').value.trim();
  if (!url) { S.set.url = ''; S.set.pin = ''; persist(); closeSheet(); setStatus('loc'); render(); return toast('تم العمل في الوضع المحلي'); }
  if (!/^https:\/\/script\.google\.com\//.test(url)) return toast('الرابط يجب أن يبدأ بـ https://script.google.com/', true);
  if (!pin) return toast('اكتب الرقم السري', true);
  const prev = Object.assign({}, S.set); S.set.url = url; S.set.pin = pin; setStatus('wait');
  try {
    const r = await api('login');
    if (!r.ok) { S.set = prev; setStatus(prev.url ? 'ok' : 'loc'); return toast(r.error || 'فشل الاتصال', true); }
    S.set.user = r.user; S.set.role = r.role;
    const hadLocal = !prev.url && VDB().txns.length > 0;
    if (hadLocal) {
      if (confirm('يوجد ' + VDB().txns.length + ' حركة مسجلة محليًا على هذا الجهاز. هل ترفعها إلى الملف المشترك؟\n(إن كانت بيانات تجريبية اختر إلغاء ثم امسحها من الإعدادات)')) {
        S.out = VDB().txns.map(t => ({ op: 'saveTx', tx: t, pays: VDB().pays.filter(p => p.tx === t.id) }));
      } else { S.db = { txns: [], pays: [] }; }
    } else { S.db = { txns: [], pays: [] }; }
    persist(); closeSheet(); toast('تم الاتصال ✓ ' + r.user);
    if (S.out.length) await flush(); else await refresh();
    render();
  } catch (e) { S.set = prev; setStatus(prev.url ? 'off' : 'loc'); toast('تعذر الوصول للرابط — تحقق من النشر "أي شخص" ومن اتصال الإنترنت', true); }
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'tab': S.tab = d.tab; closeSheet(); render(); window.scrollTo(0, 0); break;
    case 'new': openForm(d.type); break;
    case 'close': closeSheet(); break;
    case 'detail': openDetail(d.id); break;
    case 'txf': S.tx.f = d.f; render(); break;
    case 'side': S.due.side = d.side; render(); break;
    case 'goDue': S.due.side = d.side; S.tab = 'dues'; render(); window.scrollTo(0, 0); break;
    case 'rkind': S.rep.kind = d.k; S.rep.off = 0; if (d.k === 'custom' && !S.rep.custom.from) { const r = C.getRange('month', today(), 0); S.rep.custom = { from: r.start, to: today() }; } render(); break;
    case 'roff': S.rep.off += +d.d; render(); break;
    case 'rsub': S.rep.sub = d.s; render(); break;
    case 'bycolor': S.rep.byColor = !S.rep.byColor; render(); break;
    case 'share': openWA(reportText(window._lastReport.R, window._lastReport.r)); break;
    case 'print': window.print(); break;
    case 'csv': exportCsv(); break;
    case 'pay': openPay(d.id); break;
    case 'payMethod': window._pay.method = d.m; $$('#payMethods .chip').forEach(c => c.classList.toggle('on', c.dataset.m === d.m)); break;
    case 'savePay': savePayForm(); break;
    case 'remind': { const side = C.position(VDB(), today()).ar; const p = side.parties.get(d.party); if (p) openWA(remindText(p), waNumber(p.phone)); break; }
    case 'stmt': S.rep.sub = 'stmt'; S.rep.stParty = d.type + '|' + d.party; S.tab = 'reports'; closeSheet(); render(); window.scrollTo(0, 0); break;
    case 'shareStmt': {
      const [type, key] = S.rep.stParty.split('|'), st = C.statement(VDB(), type, key), nm = (VDB().txns.find(t => t.type === type && C.nameKey(t.party) === key) || {}).party || '';
      const L = ['كشف حساب — ' + nm, ''];
      st.rows.forEach(r => L.push(C.shortDate(r.date) + '  ' + (r.kind === 'inv' ? r.t.item + ' : ' + fmt(r.debit) : 'دفعة ' + (r.p.method || '') + ' : −' + fmt(r.credit)) + '  | الرصيد ' + fmt(r.bal)));
      L.push('', 'الرصيد المستحق: ' + fmt(st.balance) + ' ' + C.CURRENCY); openWA(L.join('\n')); break; }
    case 'edit': { const t = getTx(d.id); closeSheet(); openForm(t.type, t); break; }
    case 'copy': { const t = getTx(d.id); closeSheet(); openForm(t.type, t, true); break; }
    case 'voidTx': if (confirm('إلغاء هذه الحركة؟ ستبقى في السجل كملغاة ولن تُحتسب في التقارير.')) { closeSheet(); commit([{ op: 'voidTx', id: d.id }]); toast('تم الإلغاء'); } break;
    case 'voidPay': if (confirm('إلغاء هذه الدفعة؟')) { const p = VDB().pays.find(x => x.id === d.id); closeSheet(); commit([{ op: 'voidPay', id: d.id }]); toast('تم إلغاء الدفعة'); if (p) openDetail(p.tx); } break;
    case 'settings': openSettings(); break;
    case 'connect': connect(); break;
    case 'syncNow': flush().then(() => toast('تمت المزامنة')); break;
    case 'logout': S.set.pin = ''; S.set.user = ''; S.db = { txns: [], pays: [] }; S.out = []; persist(); closeSheet(); render(); openSettings(); break;
    case 'seed': seedDemo(); closeSheet(); break;
    case 'wipe': if (confirm('مسح كل بيانات هذا الجهاز؟ لا يمكن التراجع.')) { S.db = { txns: [], pays: [] }; persist(); closeSheet(); render(); } break;
    // form
    case 'save': saveForm(); break;
    case 'color': F.color = d.c; $('#colors').innerHTML = colorsHtml(); recalc(); break;
    case 'unit': F.unit = d.u; $('#unitseg').innerHTML = unitSegHtml(); $('#dims').innerHTML = dimsHtml(); recalc(); break;
    case 'shipmode': F.shipMode = d.m; $('#shipseg').innerHTML = shipSegHtml(); recalc(); break;
    case 'paymode': F.payMode = d.m; if (d.m === 'none') F.paid = ''; if (d.m === 'part' && F.paid && num(F.paid) === formTotals().total) F.paid = ''; $('#payblock').innerHTML = payBlockHtml(); recalc(); break;
    case 'method': F.method = d.m; $$('#payblock .chip[data-act=method]').forEach(c => c.classList.toggle('on', c.dataset.m === d.m)); break;
    case 'term': F.term = +d.d; $$('#duebox .chip').forEach(c => c.classList.toggle('on', +c.dataset.d === F.term)); recalc(); break;
    case 'useLast': F.price = d.p; F._last = 'price'; $('[data-ff=price]').value = F.price; recalc(); break;
    case 'addItem': { const n = C.normName($('#niName').value); if (!n) return toast('اكتب اسم الصنف', true); const g = $('#niGrp').value; F.item = n; F.grp = g; const gg = C.GROUPS[g]; if (!gg.units.includes(F.unit)) F.unit = gg.def; const sel = $('[data-ff=item]'); sel.insertAdjacentHTML('afterbegin', '<option selected>' + esc(n) + '</option>'); sel.value = n; $('#newitem').classList.add('hide'); $('#dims').innerHTML = dimsHtml(); $('#unitseg').innerHTML = unitSegHtml(); recalc(); break; }
  }
});
function onField(ev, isChange) {
  const el = ev.target;
  if (el.id === 'viewAs') { S.set.viewAs = el.value; persist(); render(); return; }
  if (el.dataset.ff && F) {
    const k = el.dataset.ff, v = el.value;
    if (k === 'item') { if (v === '__new') { $('#newitem').classList.remove('hide'); el.value = F.item || ''; return; } if (isChange) setItem(v); return; }
    if (k === 'colorOther') { F.color = v.trim(); $$('#colors .col').forEach(c => c.classList.remove('on')); return; }
    F[k] = v;
    if (k === 'price') F._last = 'price'; if (k === 'goods') F._last = 'goods';
    if (k === 'paid') F.payMode = F.payMode === 'full' ? 'part' : F.payMode;
    if (k === 'due') { F.term = null; $$('#duebox .chip').forEach(c => c.classList.remove('on')); }
    if (k === 'party' && isChange && !F.phone) { const p = partyNames(F.type).find(x => C.nameKey(x.name) === C.nameKey(v)); if (p && p.phone) { F.phone = p.phone; const ph = $('[data-ff=phone]'); if (ph) ph.value = p.phone; } }
    if (k === 'date' && F.term !== null && F.term !== undefined) { /* due follows date */ }
    if (k === 'paid' && F.payMode === 'part') { /* keep */ }
    recalc();
    return;
  }
  const f = el.dataset.f; if (!f) return;
  if (f === 'txq') { S.tx.q = el.value; render(); }
  else if (f === 'cfrom') { S.rep.custom.from = el.value; render(); } else if (f === 'cto') { S.rep.custom.to = el.value; render(); }
  else if (f === 'stparty') { S.rep.stParty = el.value; render(); }
}
document.addEventListener('input', ev => onField(ev, false));
document.addEventListener('change', ev => onField(ev, true));

    '<header class="top"><h1>🧽 سجل الفوم</h1><span class="sync" id="sync"></span><button class="iconbtn" data-act="settings" aria-label="الإعدادات">⚙</button></header>' +
    '<main id="main"></main>' +
    '<nav class="bar">' +
    '<button data-act="tab" data-tab="home"><span class="ic">🏠</span>الرئيسية</button>' +
    '<button data-act="tab" data-tab="tx"><span class="ic">🧾</span>الحركات</button>' +
    '<button class="fab" data-act="new" data-type="P" id="fabBtn" aria-label="إضافة"><span class="circ">＋</span></button>' +
    '<button data-act="tab" data-tab="dues"><span class="ic">💳</span>المستحقات<span class="pill hide" id="pill">!</span></button>' +
    '<button data-act="tab" data-tab="reports"><span class="ic">📊</span>التقارير</button></nav>';
  // the center + opens a chooser (purchase / sale)
  $('#fabBtn').dataset.act = 'chooser';
  render();
  if (remote()) { if (!S.set.pin) openSettings(); else { setStatus(S.out.length ? 'wait' : 'ok'); flush().then(() => refresh(true)); } }
  setInterval(poll, 45000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  window.addEventListener('online', () => flush());
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act=chooser]'); if (!el) return;
  if (!canWrite()) return toast('صلاحيتك عرض فقط', true);
  openSheet('ماذا تريد أن تسجل؟', '<div class="grid2"><button class="btn pur" style="min-height:90px;font-size:1.2rem" data-act="new" data-type="P">🛒<br>شراء</button><button class="btn sal" style="min-height:90px;font-size:1.2rem" data-act="new" data-type="S">💰<br>بيع</button></div>', '');
});
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();


})();
